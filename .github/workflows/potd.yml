name: Problem of the day

# Fires hourly; the script itself decides whether the current Indiana-local
# hour is a send slot (08, 14, 20, 02). Doing the gating in Python rather than
# in cron keeps the schedule correct across US daylight-saving transitions,
# which GitHub's UTC-only cron cannot express.
on:
  # Fired punctually by an external scheduler; repository_dispatch runs
  # start within seconds, unlike GitHub's own scheduled queue which is
  # shed under load and routinely lands an hour or more late.
  repository_dispatch:
    types: [potd-cf]
  # Hourly safety net: catches the day's mail if the poke never arrives.
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      force_hour:
        description: 'Pretend it is this Indiana hour (8, 14, 20, 2)'
        required: false
        default: '8'
      dry_run:
        description: 'Print the email instead of sending it'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

concurrency:
  group: potd
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Send
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT: ${{ secrets.RECIPIENT }}
          CF_HANDLE: ${{ vars.CF_HANDLE }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ARGS="--force-hour ${{ inputs.force_hour }}"
            [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          fi
          python potd/cp_potd.py $ARGS

      - name: Persist state
        run: |
          if [ -n "$(git status --porcelain potd/state.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add potd/state.json
            git commit -m "potd: record today's problem"
            # daily_practice.yml also pushes to main; rebase rather than fight it.
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push origin main && break
              sleep 5
            done
          fi
